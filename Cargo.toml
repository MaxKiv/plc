[package]
name = "plc-lite"
version = "0.1.0"
edition = "2024"
resolver = "3"

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
defmt = "1.0.1"
defmt-rtt = "1.0.0"
embassy-executor = { version = "0.9.1", features = ["arch-cortex-m", "defmt", "executor-thread" ] }
embassy-futures = { version = "0.1.1", features = ["defmt"] }
embassy-sync = { version = "0.7.2", features = ["defmt"] }
embassy-time = { version = "0.5.0", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embedded-hal = "1.0.0"
heapless = { version = "0.8.0", features = ["serde", "defmt-03"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
postcard = { version = "1.1.3", features = ["defmt", "use-defmt"] }
serde = { version =     "1.0.219", default-features = false, features = ["serde_derive"] }
uom = { version = "0.37.0", default-features = false, features = ["serde", "si", "u32"] }
chrono = { version = "0.4.41", features = ["serde"], default-features = false }
embedded-io-async = { version = "=0.7.0", features = ["defmt"] }
static_cell = "2.1.1"
thiserror = { version = "2.0.17", default-features = false }

love-letter = { path = "../love-letter" }
# love-letter = { git = "ssh://git@bitbucket.org/mechatronica/love_letter.git" }

[patch.crates-io]
# embassy-stm32       = { path = "/home/max/git/embassy-fork/embassy-stm32" }
# embassy-time        = { path = "/home/max/git/embassy-fork/embassy-time" }
# embassy-time-driver = { path = "/home/max/git/embassy-fork/embassy-time-driver" }
# embassy-executor    = { path = "/home/max/git/embassy-fork/embassy-executor" }
# embassy-sync    = { path = "/home/max/git/embassy-fork/embassy-sync" }
# embassy-futures    = { path = "/home/max/git/embassy-fork/embassy-futures" }
embassy-stm32       = { git = "ssh://git@bitbucket.org/mechatronica/embassy-stm32.git" }
embassy-time        = { git = "ssh://git@bitbucket.org/mechatronica/embassy-stm32.git" }
embassy-time-driver = { git = "ssh://git@bitbucket.org/mechatronica/embassy-stm32.git" }
embassy-executor    = { git = "ssh://git@bitbucket.org/mechatronica/embassy-stm32.git" }
embassy-sync    = { git = "ssh://git@bitbucket.org/mechatronica/embassy-stm32.git" }
embassy-futures    = { git = "ssh://git@bitbucket.org/mechatronica/embassy-stm32.git" }

# embassy-stm32 provides our HAL
[dependencies.embassy-stm32]
version = "0.5.0"
optional = true
default-features = false
features = ["defmt", "rt", "chrono", "exti"]

[features]
default = [ "stm32g474re" ]
stm32f103c6 = ["embassy-stm32/stm32f103c6", "embassy-stm32/time-driver-any"]
stm32g474re = ["embassy-stm32/stm32g474re", "embassy-stm32/dual-bank", "embassy-stm32/time-driver-tim2"]
